<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event Registration | Thinkers Hub</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* Professional Neutral & Brand Accent Palette */
      --brand-navy: #0f172a;
      --brand-blue: #0284c7;
      
      /* Steel Blue Theme for CTA Button */
      --steel-blue: #4682b4;
      --steel-blue-hover: #36648b;

      --bg-silver: #f1f5f9;
      --surface-white: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: #e2e8f0;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    body { display: flex; justify-content: center; align-items: center; }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-silver);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* TOP BAR: Clean White */
    .top-bar {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      color: var(--brand-navy);
      z-index: 10;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--brand-navy);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .back-btn:hover { opacity: 0.8; }

    .action-icons { display: flex; align-items: center; gap: 12px; }

    .icon-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--brand-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover { background: #ffffff; border-color: #cbd5e1; }

    /* CONTENT SCROLL: Silver Background with White Content Cards */
    .content-scroll {
      flex: 1;
      background: var(--bg-silver);
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 110px 12px;
      
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .content-scroll::-webkit-scrollbar { display: none; }

    /* Hidden by default to prevent broken image flash */
    .hero-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      display: none; 
    }

    .hero-image-container {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
    }

    .main-content-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .event-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--brand-navy);
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .meta-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
    }

    .meta-item i { color: var(--steel-blue); margin-top: 2px; flex-shrink: 0; }

    /* Facilitator WhatsApp Button */
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      margin-left: 8px;
      transition: opacity 0.2s;
    }
    .wa-btn:hover { opacity: 0.9; }

    /* Organizer Card */
    .organizer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 16px;
      margin-bottom: 18px;
    }

    .organizer-info { display: flex; align-items: center; gap: 12px; }

    .organizer-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e2e8f0;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .organizer-details { display: flex; flex-direction: column; }
    .organizer-by { font-size: 13px; color: var(--text-muted); font-weight: 500; line-height: 1.2; }
    .organizer-name { font-weight: 700; color: var(--brand-navy); }
    .organizer-subtext { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .visit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 16px;
      border: 1.5px solid var(--steel-blue);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--steel-blue);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .visit-btn:hover { background-color: var(--steel-blue); color: #ffffff; }

    .divider { height: 1px; background-color: var(--border); margin: 20px 0; }
    .overview-section { display: none; } /* Shown conditionally */
    .section-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: var(--brand-navy); }
    .overview-text { color: #475569; font-size: 14px; line-height: 1.6; }

    /* BOTTOM BAR: Clean White */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 84px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
      z-index: 30;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .batch-input-wrapper { flex: 1; display: flex; flex-direction: column; gap: 4px; }

    .batch-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      background-color: #f8fafc;
      color: var(--brand-navy);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .batch-input::placeholder { color: #94a3b8; font-weight: 500; }
    .batch-input:focus { border-color: var(--steel-blue); background-color: #ffffff; }
    .batch-input.is-invalid { border-color: #ef4444; }
    .batch-input.is-valid { border-color: #22c55e; }

    /* BUTTON: Steel Blue CTA */
    .btn-reserve {
      background-color: var(--steel-blue);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(70, 130, 180, 0.3);
    }

    .btn-reserve:hover:not(:disabled) {
      background-color: var(--steel-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(70, 130, 180, 0.4);
    }

    .btn-reserve:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-card {
      width: 100%;
      background: #ffffff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-card { transform: translateY(0); }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--brand-navy); }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--steel-blue); }
    
    .submit-btn { 
      width: 100%; 
      background-color: var(--steel-blue); 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 10px; 
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: var(--steel-blue-hover); }

    .toast {
      position: absolute;
      top: 66px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0f172a; color: #fff;
      padding: 8px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease; z-index: 60;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="toast" id="toast">Link copied to clipboard!</div>

    <!-- Hidden target iframe for cross-domain Google Form POST -->
    <iframe 
      name="hidden_iframe" 
      id="hidden_iframe" 
      style="display:none;" 
      onload="if(submitted){ handleSubmissionSuccess(); }">
    </iframe>

    <!-- Top Bar (White Header) -->
    <header class="top-bar">
      <a href="https://www.thinkingskill.in" class="back-btn">
        <i data-lucide="arrow-left" size="18"></i>
        <span>Back to Thinker Hub</span>
      </a>

      <div class="action-icons">
        <button class="icon-btn" id="shareBtn" title="Share Event">
          <i data-lucide="share-2" size="18"></i>
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <div class="content-scroll">
      
      <!-- Hero Image Card -->
      <div class="hero-card" id="heroCard">
        <div class="hero-image-container">
          <img 
            id="heroBanner"
            alt="Course Banner" 
            class="hero-image"
            onerror="document.getElementById('heroCard').style.display='none';"
          />
        </div>
      </div>

      <main class="main-content-card">
        <h1 class="event-title" id="courseTitle">Google Flow for Beginners</h1>

        <div class="meta-list">
          <div class="meta-item" id="locationItem" style="display: none;">
            <i data-lucide="map-pin" size="18"></i>
            <span id="eventLink">Online Event (Free)</span>
          </div>
          <div class="meta-item" id="dateTimeItem" style="display: none;">
            <i data-lucide="calendar" size="18"></i>
            <span id="eventDateTime">Sat, Nov 21st • 10-11am IST</span>
          </div>

          <!-- Facilitator & Contact WhatsApp Row -->
          <div class="meta-item" id="facilitatorItem" style="display: none;">
            <i data-lucide="user" size="18"></i>
            <div>
              <span id="facilitatorName">Facilitator Name</span>
              <a href="#" id="facilitatorWALink" target="_blank" class="wa-btn">
                💬 WhatsApp
              </a>
            </div>
          </div>
        </div>

        <!-- Organizer Card -->
        <div class="organizer-card">
          <div class="organizer-info">
            <img 
              id="organizerLogo"
              src="https://lh3.googleusercontent.com/d/1IBGBjphVdRvG1VkRRVxAXC4WrBj6egAg" 
              alt="Thinkers Hub Logo" 
              class="organizer-logo"
            />
            <div class="organizer-details">
              <span class="organizer-by">by <span class="organizer-name">Thinkers Hub</span></span>
              <span class="organizer-subtext" id="learnersCount">0 learners joined</span>
            </div>
          </div>
          <a href="https://www.thinkingskill.in" target="_blank" class="visit-btn">Visit</a>
        </div>

        <!-- Overview Section -->
        <div class="overview-section" id="overviewSection">
          <div class="divider"></div>
          <section>
            <h2 class="section-title">Overview</h2>
            <p class="overview-text" id="courseOverview"></p>
          </section>
        </div>
      </main>
    </div>

    <!-- Bottom Reservation Bar (White) -->
    <footer class="bottom-bar">
      <div class="batch-input-wrapper">
        <input 
          type="text" 
          id="batchCodeInput" 
          class="batch-input" 
          placeholder="Enter Batch Code" 
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button class="btn-reserve" id="openModalBtn" disabled>Register now</button>
    </footer>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Register Now</h3>
          <button class="close-btn" id="closeModalBtn">
            <i data-lucide="x" size="20"></i>
          </button>
        </div>

        <form 
          id="bookingForm"
          action="https://docs.google.com/forms/d/e/1FAIpQLScliz0hmsuSd30UhjTuowFlcUVXcKO7oDgsGRyKo7xzL-YYjw/formResponse"
          method="POST"
          target="hidden_iframe"
          onsubmit="submitted=true;">

          <div class="form-group">
            <label class="form-label" for="nameInput">Full Name</label>
            <input 
              type="text" 
              id="nameInput" 
              name="entry.1284435015" 
              class="form-input" 
              placeholder="John Doe" 
              required 
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="emailInput">Email Address</label>
            <input 
              type="email" 
              id="emailInput" 
              name="entry.1988767158" 
              class="form-input" 
              placeholder="john@example.com" 
              required 
            />
          </div>

          <input 
            type="hidden" 
            id="batchCodeFormInput" 
            name="entry.2046668482" 
            value="" 
          />

          <button type="submit" class="submit-btn" id="submitBtn">Confirm Registration</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    var submitted = false;

    // DOM Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const bookingForm = document.getElementById('bookingForm');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const batchCodeInput = document.getElementById('batchCodeInput');
    const batchCodeFormInput = document.getElementById('batchCodeFormInput');
    const submitBtn = document.getElementById('submitBtn');
    const heroCard = document.getElementById('heroCard');
    const heroBanner = document.getElementById('heroBanner');

    let VALID_BATCH_CODE = "TL211126";

    const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa1DwC7x54wuxZJoYFBhCt8SzHBpkWuqyH7XQIcMzdjj6_VXBl1DOJne8oaX4jcujrrpTJlvj_E9qM/pub?gid=1114785347&single=true&output=csv";
    const PUBLIC_FEED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa1DwC7x54wuxZJoYFBhCt8SzHBpkWuqyH7XQIcMzdjj6_VXBl1DOJne8oaX4jcujrrpTJlvj_E9qM/pub?gid=1149121719&single=true&output=csv";

    function parseCSV(text) {
      return text.split('\n')
        .map(row => row.trim())
        .filter(row => row.length > 0)
        .map(row => row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
    }

    async function loadPublicFeed() {
      try {
        const res = await fetch(PUBLIC_FEED_CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        let learnerCount = 0;
        if (rows.length > 1 && !isNaN(parseInt(rows[1][1]))) {
          learnerCount = parseInt(rows[1][1]);
        } else {
          const validLearners = rows.slice(1).filter(r => r[0] && r[0] !== '-' && r[0] !== '');
          learnerCount = validLearners.length;
        }

        document.getElementById('learnersCount').textContent = `${learnerCount} learners joined`;
      } catch (e) {
        console.warn("Could not load Public Feed CSV:", e);
      }
    }

    async function loadMasterCourses() {
      try {
        const res = await fetch(MASTER_CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        
        if (rows.length > 1) {
          const row = rows[1];

          // 1. Batch Code & Title
          VALID_BATCH_CODE = row[0] ? row[0].trim() : VALID_BATCH_CODE;
          if (row[1]) document.getElementById('courseTitle').textContent = row[1].trim();

          // 2. Date & Time
          const dateStr = row[2] ? row[2].trim() : "";
          const timeStr = row[3] ? row[3].trim() : "";
          if (dateStr || timeStr) {
            document.getElementById('eventDateTime').textContent = `${dateStr} ${timeStr ? '• ' + timeStr : ''}`.trim();
            document.getElementById('dateTimeItem').style.display = 'flex';
          }

          // 3. Location / Link
          const locationStr = row[4] ? row[4].trim() : "";
          if (locationStr && locationStr !== "-") {
            document.getElementById('eventLink').textContent = locationStr;
            document.getElementById('locationItem').style.display = 'flex';
          }

          // 4. Facilitator & WhatsApp
          const facilitator = row[5] ? row[5].trim() : "";
          const waNumber = row[6] ? row[6].replace(/[^0-9]/g, '') : "";
          if (facilitator && facilitator !== "-") {
            document.getElementById('facilitatorName').textContent = facilitator;
            const waLink = document.getElementById('facilitatorWALink');
            
            if (waNumber) {
              const msg = encodeURIComponent(`Hi ${facilitator}, I have a query regarding ${document.getElementById('courseTitle').textContent}`);
              waLink.href = `https://wa.me/${waNumber}?text=${msg}`;
              waLink.style.display = 'inline-flex';
            } else {
              waLink.style.display = 'none';
            }
            document.getElementById('facilitatorItem').style.display = 'flex';
          }

          // 5. Overview Text
          const overviewText = row[7] ? row[7].trim() : "";
          if (overviewText && overviewText !== "-") {
            document.getElementById('courseOverview').textContent = overviewText;
            document.getElementById('overviewSection').style.display = 'block';
          }

          // 6. Dynamic Hero Image
          const imageId = row[8] ? row[8].trim() : "";
          if (imageId && imageId !== "-" && imageId.toLowerCase() !== "undefined") {
            // Using Google Drive Thumbnail URL for reliable cross-domain rendering
            heroBanner.src = `https://drive.google.com/thumbnail?id=${imageId}&sz=w1000`;
            heroCard.style.display = "block";
          } else {
            heroCard.style.display = "none";
          }

          // 7. Organizer Logo
          const logoId = row[9] ? row[9].trim() : "";
          if (logoId && logoId !== "-") {
            document.getElementById('organizerLogo').src = `https://drive.google.com/thumbnail?id=${logoId}&sz=w200`;
          }
        }
      } catch (e) {
        console.warn("Could not load Master Courses CSV:", e);
        heroCard.style.display = "none";
      }
    }

    loadMasterCourses();
    loadPublicFeed();

    // Batch Code Validation
    batchCodeInput.addEventListener('input', () => {
      const enteredCode = batchCodeInput.value.trim().toUpperCase();

      if (enteredCode === VALID_BATCH_CODE) {
        openModalBtn.disabled = false;
        batchCodeInput.classList.remove('is-invalid');
        batchCodeInput.classList.add('is-valid');
      } else {
        openModalBtn.disabled = true;
        batchCodeInput.classList.remove('is-valid');
        if (enteredCode.length >= VALID_BATCH_CODE.length) {
          batchCodeInput.classList.add('is-invalid');
        } else {
          batchCodeInput.classList.remove('is-invalid');
        }
      }
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    openModalBtn.addEventListener('click', () => {
      if (!openModalBtn.disabled) {
        batchCodeFormInput.value = batchCodeInput.value.trim().toUpperCase();
        modalOverlay.classList.add('open');
      }
    });
    
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('open');
    });

    function handleSubmissionSuccess() {
      if (!submitted) return;
      
      alert('Registration successful! Check your email for event access instructions.');
      modalOverlay.classList.remove('open');
      bookingForm.reset();

      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm Registration';
      submitted = false;

      setTimeout(loadPublicFeed, 2500);
    }

    shareBtn.addEventListener('click', async () => {
      const shareData = {
        title: document.getElementById('courseTitle').textContent,
        text: document.getElementById('courseOverview').textContent,
        url: window.location.href,
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('Event link copied to clipboard!');
      }
    });
  </script>
</body>
</html>
